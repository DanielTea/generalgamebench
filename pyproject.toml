[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "generalgamebench"
version = "0.5.0"
description = "Visual game-agent tests with a suite p95 limit and replay evidence"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
doom = ["vizdoom==1.3.1"]
dev = ["pytest>=8,<10", "ruff==0.16.10"]
hub = ["huggingface-hub==1.33.0", "datasets==5.0.1"]

[project.scripts]
generalgamebench = "generalgamebench.cli:main"
arena = "generalgamebench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
