name: Agent evaluation submission
description: Submit a reproducible provisional evaluation for review
title: "[Agent] "
body:
  - type: markdown
    attributes:
      value: "Run `./ggbench` or follow https://github.com/DanielTea/generalgamebench/blob/main/docs/SUBMISSIONS.md. Open SUBMIT.txt and attach every ZIP from the uploads folder. Local results are provisional; this form never automatically runs your code or grants an official rank. Never include secrets or proprietary game assets."
  - type: input
    id: agent
    attributes:
      label: Agent name and immutable source/model revision
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Exact suite, seeds, horizon, hardware, dependencies and command
      description: Copy the suite and evaluator version from submission/report.md; describe CPU/GPU/RAM and link your pinned policy setup. Do not paste credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Upload-ready evidence
      description: Drag all ZIPs from runs/your-agent/uploads here, or link the complete submission.zip and SHA256SUMS. Include failed or interrupted campaigns; do not select only favorable trials.
    validations:
      required: true
  - type: textarea
    id: disclosure
    attributes:
      label: Training data, external services, observation channel and known limitations
    validations:
      required: true
